# Coupon service — build, provision, deploy, verify.
#
# The stage order is approach.md §7. Two orderings in it are load-bearing rather than
# tidy:
#
#   Build and test run first, so no Azure resource is ever created for code that does not
#   compile.
#
#   Grant DB access runs before the backend is deployed. The application runs its EF Core
#   migrations at startup, so an app deployed before its database user exists starts,
#   fails, and reports a deployment problem for what is actually a permissions problem.
#
# Deleting the resource group and running this pipeline produces a working system. The
# one thing that would otherwise break that promise is APIM soft-delete, handled in the
# provision stage below.
#
# No secret appears in this file. The App Service reaches SQL with its managed identity,
# APIM reaches the App Service with its own, and the subscription key the smoke test uses
# is read from APIM at the moment it is needed.

trigger:
  branches:
    include:
      - master
      - main

pool:
  vmImage: ubuntu-latest

variables:
  # --- Deployment target -------------------------------------------------------------
  serviceConnection: 'azure-lab'
  resourceGroupName: 'rg-coupon-service'
  location: 'centralindia'

  # --- Bicep parameters --------------------------------------------------------------
  namePrefix: 'couponsvc'
  environmentName: 'lab'

  # The coupon-api app registration, created on Day 0 (approach.md §7). A client ID is a
  # public identifier, not a credential — it appears in every token this API issues.
  # docs/decisions.md, "Spike 3 — app registrations and the PKCE flow".
  apiClientId: '90a27142-cffb-4879-873a-bc0a99112ce7'

  # The Entra tenant. Bicep defaults its own tenantId parameter to subscription().tenantId
  # and does not need this, but the frontend build does — MSAL's authority is built from it
  # — and a pipeline variable is the only way it reaches npm. Public identifier.
  tenantId: '8edd202c-5474-4669-9b35-253da7a27cd2'

  # The coupon-spa registration, created on Day 0. Public identifier, like apiClientId.
  spaClientId: '04a724e0-6bd9-4285-ab7f-b00d2ce30e2c'

  # The origin registered as a redirect URI on coupon-spa, by hand, as a Day 0 item.
  #
  # The pipeline cannot read the registration back — that is a Microsoft Graph call its
  # principal has no permission to make, the same wall as `az ad sp show`. So this
  # variable IS the record of what was registered, and the frontend stage fails if the
  # deployed origin stops matching it. That catches drift in the zNN DNS segment, which
  # is assigned at account creation and is not guaranteed across a delete-and-recreate.
  #
  # A green run means "deployment still produces the origin someone registered". It does
  # NOT mean "Entra is correct" — nothing in the pipeline can check that.
  expectedFrontendOrigin: 'https://stcouponsvclabdtjori.z29.web.core.windows.net'

  # Used by API Management for service notifications only.
  apimPublisherEmail: 'publisher@example.com'
  apimPublisherName: 'Coupon Service'

  # --- Build -------------------------------------------------------------------------
  buildConfiguration: 'Release'
  apiProject: 'src/PizzaShop.Api/PizzaShop.Api.csproj'

stages:

# =====================================================================================
# 1. Build and test
# =====================================================================================
- stage: BuildAndTest
  displayName: '1 · Build and test'
  jobs:
  - job: BuildAndTest
    displayName: 'Build, test, publish artifact'
    steps:

    - task: UseDotNet@2
      displayName: 'Install .NET 8 SDK'
      inputs:
        packageType: sdk
        version: '8.0.x'

    - script: dotnet restore PizzaShop.sln
      displayName: 'Restore'

    - script: dotnet build PizzaShop.sln --configuration $(buildConfiguration) --no-restore
      displayName: 'Build'

    # The BDD scenarios run against SQLite in-memory through WebApplicationFactory, so
    # they need no Azure resource and no database — which is why this stage comes before
    # anything is provisioned.
    - script: >-
        dotnet test PizzaShop.sln
        --configuration $(buildConfiguration)
        --no-build
        --logger trx
        --results-directory $(Agent.TempDirectory)/testresults
      displayName: 'Test'

    - task: PublishTestResults@2
      displayName: 'Publish test results'
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: VSTest
        testResultsFiles: '**/*.trx'
        searchFolder: '$(Agent.TempDirectory)/testresults'
        failTaskOnFailedTests: true

    - script: >-
        dotnet publish $(apiProject)
        --configuration $(buildConfiguration)
        --no-build
        --output $(Build.ArtifactStagingDirectory)/api
      displayName: 'Publish API'

    - task: ArchiveFiles@2
      displayName: 'Archive API'
      inputs:
        rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/api'
        includeRootFolder: false
        archiveType: zip
        archiveFile: '$(Build.ArtifactStagingDirectory)/api.zip'
        replaceExistingArchive: true

    - publish: '$(Build.ArtifactStagingDirectory)/api.zip'
      artifact: api
      displayName: 'Publish artifact'

    # infra/ is needed by later stages — the Bicep templates, the grant script and the
    # smoke test. Publishing it as an artifact means every stage deploys the same
    # revision, rather than each re-checking out and possibly picking up a newer commit.
    - publish: 'infra'
      artifact: infra
      displayName: 'Publish infrastructure sources'

    # Same reasoning as infra/: every stage builds the revision this run tested, rather
    # than re-checking out. The frontend cannot be built here — the gateway URL is
    # compiled into the JavaScript and is not known until provisioning has run.
    - publish: 'web'
      artifact: web
      displayName: 'Publish frontend sources'

# =====================================================================================
# 2. Provision
# =====================================================================================
- stage: Provision
  displayName: '2 · Provision'
  dependsOn: BuildAndTest
  condition: succeeded()
  jobs:
  - job: Provision
    displayName: 'Resource group and Bicep deployment'
    steps:

    - download: current
      artifact: infra

    - task: AzureCLI@2
      name: deploy
      displayName: 'Deploy infra/main.bicep'
      inputs:
        azureSubscription: '$(serviceConnection)'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -euo pipefail

          SUBSCRIPTION_ID=$(az account show --query id -o tsv)

          echo "==> Resource group"
          az group create \
            --name "$(resourceGroupName)" \
            --location "$(location)" \
            --output none

          # ---------------------------------------------------------------------------
          # APIM soft-delete purge.
          #
          # Deleting the resource group does not free an API Management name. The service
          # is soft-deleted for 48 hours and keeps its name reserved, so recreating it
          # fails with "service name is not available" — which reads as a naming
          # collision rather than as the residue of the previous teardown.
          #
          # Without this step, "delete the resource group and run the pipeline" does not
          # produce a working system, which is the acceptance test for this project.
          #
          # `az apim deletedservice purge`, NOT `az rest --method delete`. The purge is a
          # long-running ARM operation: it answers 202 with an async-operation header and
          # completes some time later. `az rest` is a raw HTTP call that does not follow
          # that header, so it returned immediately and the Bicep deployment below raced a
          # purge still in flight — failing with exactly the "service name is not
          # available" this step exists to prevent. The `az apim` command polls it.
          #
          # This branch had never run before 2026-08-30. Every previous execution found
          # nothing and logged "none found", because the resource group had never actually
          # been deleted — so the one step the headline claim rests on was the one step no
          # run had exercised. See docs/decisions.md, phase G.
          # ---------------------------------------------------------------------------
          echo "==> Purging any soft-deleted API Management service for this project"
          DELETED=$(az apim deletedservice list \
            --query "[?starts_with(name, 'apim-$(namePrefix)-$(environmentName)-')].id" -o tsv || true)

          if [ -z "${DELETED}" ]; then
            echo "    none found"
          else
            for id in ${DELETED}; do
              # The id is
              #   /subscriptions/<sub>/providers/Microsoft.ApiManagement/locations/<loc>/deletedservices/<name>
              # and purge takes the name and the location as separate arguments.
              APIM_NAME="${id##*/}"
              APIM_LOCATION="${id%/deletedservices/*}"
              APIM_LOCATION="${APIM_LOCATION##*/}"

              echo "    purging ${APIM_NAME} (${APIM_LOCATION})"
              az apim deletedservice purge \
                --service-name "${APIM_NAME}" \
                --location "${APIM_LOCATION}" \
                --output none

              # Belt and braces. The CLI waits for the purge operation itself, but ARM
              # releases the reserved name behind it. checkNameAvailability asks exactly
              # the question the deployment is about to ask, so ask it here — where a
              # failure says what it means, instead of arriving as a template error.
              echo "    waiting for the name to be released"
              NAME_FREE=false
              for attempt in $(seq 1 30); do
                AVAILABLE=$(az rest --method post \
                  --url "https://management.azure.com/subscriptions/${SUBSCRIPTION_ID}/providers/Microsoft.ApiManagement/checkNameAvailability?api-version=2022-08-01" \
                  --headers "Content-Type=application/json" \
                  --body "{\"name\":\"${APIM_NAME}\",\"type\":\"Microsoft.ApiManagement/service\"}" \
                  --query nameAvailable -o tsv 2>/dev/null || echo "false")

                # No $(( )) arithmetic anywhere in this block on purpose. Azure DevOps
                # leaves an unrecognised $(name) in the script text verbatim, which is
                # benign here — but this project has already lost a cycle to a $(macro)
                # that silently became an empty string, and the attempt number says
                # everything the elapsed seconds would.
                if [ "${AVAILABLE}" = "true" ]; then
                  echo "    ${APIM_NAME} released (attempt ${attempt} of 30, 10s apart)"
                  NAME_FREE=true
                  break
                fi
                sleep 10
              done

              if [ "${NAME_FREE}" != "true" ]; then
                echo "##vso[task.logissue type=error]${APIM_NAME} is still reserved 300s after its purge reported complete. The Bicep deployment would fail with 'service name is not available'. Re-run; if it persists the soft-delete has not been released and the 48-hour window applies."
                exit 1
              fi
            done
          fi

          # ---------------------------------------------------------------------------
          # Log Analytics soft-delete.
          #
          # A deleted workspace is held for 14 days with its name reserved — the same shape
          # of problem as the APIM purge above, with a different resolution, because there
          # is no purge API for it. Recreating a workspace with the same name, in the same
          # resource group and location, RECOVERS the soft-deleted one. That is exactly
          # what this deployment does, and it is the outcome we want: the name and the
          # workspace ID come back.
          #
          # So there is nothing to fix here, only something to say. It is checked rather
          # than assumed because "it usually just works" is the phrase that covered the
          # APIM purge for eleven green runs while that step was, in fact, broken. A
          # soft-deleted workspace nobody mentioned would make a failed recovery look like
          # a fresh provisioning fault, and send someone to the wrong layer.
          # ---------------------------------------------------------------------------
          echo "==> Checking for a soft-deleted Log Analytics workspace"
          DELETED_WS=$(az rest --method get \
            --url "https://management.azure.com/subscriptions/${SUBSCRIPTION_ID}/providers/Microsoft.OperationalInsights/deletedWorkspaces?api-version=2023-09-01" \
            --query "value[?name=='log-$(namePrefix)-$(environmentName)'].name" -o tsv || true)

          if [ -z "${DELETED_WS}" ]; then
            echo "    none found"
          else
            echo "    found: ${DELETED_WS}, inside its 14-day soft-delete window"
            echo "    The Bicep deployment will RECOVER it rather than create a new one."
            echo "    That is the intended outcome and needs no action: recovery requires the"
            echo "    same name, resource group and location, and this template supplies all"
            echo "    three. If provisioning fails on log-$(namePrefix)-$(environmentName),"
            echo "    this is the reason - there is no purge API for a workspace, so the only"
            echo "    options are to recover it or to wait the window out."
          fi

          # ---------------------------------------------------------------------------
          # The SQL Entra administrator has to be this pipeline's own principal, and ARM
          # wants its OBJECT ID. Recovering an object ID normally means `az ad sp show`,
          # a Microsoft Graph call this service principal has no permission to make.
          #
          # The ARM access token already carries it: `oid` is the principal's object ID
          # in this tenant. Reading it out of the token needs no directory permission at
          # all, which is what keeps Day 0 to the three items in approach.md §7.
          #
          # The token is never echoed and never leaves this step.
          # ---------------------------------------------------------------------------
          echo "==> Deriving the pipeline principal's object ID from the ARM token"
          ARM_TOKEN=$(az account get-access-token --resource https://management.azure.com/ --query accessToken -o tsv)
          DEPLOYING_PRINCIPAL_OBJECT_ID=$(printf '%s' "${ARM_TOKEN}" | cut -d. -f2 | python3 -c \
            'import sys,base64,json; p=sys.stdin.read().strip(); p+="="*(-len(p)%4); print(json.loads(base64.urlsafe_b64decode(p))["oid"])')
          unset ARM_TOKEN
          echo "    object ID: ${DEPLOYING_PRINCIPAL_OBJECT_ID}"

          echo "==> Bicep deployment"
          az deployment group create \
            --resource-group "$(resourceGroupName)" \
            --name "coupon-service-$(Build.BuildId)" \
            --template-file "$(Pipeline.Workspace)/infra/main.bicep" \
            --parameters \
                location="$(location)" \
                namePrefix="$(namePrefix)" \
                environmentName="$(environmentName)" \
                apiClientId="$(apiClientId)" \
                deployingPrincipalObjectId="${DEPLOYING_PRINCIPAL_OBJECT_ID}" \
                sqlAdminLogin="$(serviceConnection)-pipeline" \
                apimPublisherEmail="$(apimPublisherEmail)" \
                apimPublisherName="$(apimPublisherName)" \
            --output none

          echo "==> Reading outputs"
          OUTPUTS=$(az deployment group show \
            --resource-group "$(resourceGroupName)" \
            --name "coupon-service-$(Build.BuildId)" \
            --query properties.outputs -o json)

          get() { printf '%s' "${OUTPUTS}" | python3 -c "import sys,json;print(json.load(sys.stdin)['$1']['value'])"; }

          APP_SERVICE_NAME=$(get appServiceName)
          API_IDENTITY_CLIENT_ID=$(get apiIdentityClientId)
          API_IDENTITY_NAME=$(get apiIdentityName)
          SQL_SERVER_FQDN=$(get sqlServerFqdn)
          SQL_DATABASE_NAME=$(get sqlDatabaseName)
          APIM_SERVICE_NAME=$(get apimServiceName)
          APIM_GATEWAY_URL=$(get apimGatewayUrl)
          APIM_SUBSCRIPTION_NAME=$(get apimSubscriptionName)
          STORAGE_ACCOUNT_NAME=$(get storageAccountName)
          FRONTEND_ORIGIN=$(get frontendOrigin)

          # Republished as stage outputs so the later stages can read them.
          echo "##vso[task.setvariable variable=appServiceName;isOutput=true]${APP_SERVICE_NAME}"
          echo "##vso[task.setvariable variable=apiIdentityClientId;isOutput=true]${API_IDENTITY_CLIENT_ID}"
          echo "##vso[task.setvariable variable=apiIdentityName;isOutput=true]${API_IDENTITY_NAME}"
          echo "##vso[task.setvariable variable=sqlServerFqdn;isOutput=true]${SQL_SERVER_FQDN}"
          echo "##vso[task.setvariable variable=sqlDatabaseName;isOutput=true]${SQL_DATABASE_NAME}"
          echo "##vso[task.setvariable variable=apimServiceName;isOutput=true]${APIM_SERVICE_NAME}"
          echo "##vso[task.setvariable variable=apimGatewayUrl;isOutput=true]${APIM_GATEWAY_URL}"
          echo "##vso[task.setvariable variable=apimSubscriptionName;isOutput=true]${APIM_SUBSCRIPTION_NAME}"
          echo "##vso[task.setvariable variable=storageAccountName;isOutput=true]${STORAGE_ACCOUNT_NAME}"
          echo "##vso[task.setvariable variable=frontendOrigin;isOutput=true]${FRONTEND_ORIGIN}"
          echo "##vso[task.setvariable variable=frontendSubscriptionName;isOutput=true]$(get frontendSubscriptionName)"

          echo ""
          echo "Gateway  : ${APIM_GATEWAY_URL}"
          echo "Backend  : ${APP_SERVICE_NAME}"
          echo "Database : ${SQL_SERVER_FQDN}/${SQL_DATABASE_NAME}"
          echo "Frontend : ${FRONTEND_ORIGIN}"
          echo ""
          echo "Phase E note: the frontend origin above must be registered as a redirect URI on"
          echo "the coupon-spa app registration, character for character. Entra does exact string"
          echo "matching. The storage account name is deterministic so this URL is stable, but the DNS"
          echo "zone segment is assigned at account creation — if the account was ever recreated,"
          echo "compare this value against the registration before trusting it."

# =====================================================================================
# 3. Grant database access
# =====================================================================================
- stage: GrantDbAccess
  displayName: '3 · Grant database access'
  dependsOn: Provision
  condition: succeeded()
  variables:
    sqlServerFqdn: $[ stageDependencies.Provision.Provision.outputs['deploy.sqlServerFqdn'] ]
    sqlDatabaseName: $[ stageDependencies.Provision.Provision.outputs['deploy.sqlDatabaseName'] ]
    apiIdentityName: $[ stageDependencies.Provision.Provision.outputs['deploy.apiIdentityName'] ]
    apiIdentityClientId: $[ stageDependencies.Provision.Provision.outputs['deploy.apiIdentityClientId'] ]
  jobs:
  - job: GrantDbAccess
    displayName: 'Create the contained user for the App Service identity'
    steps:

    - download: current
      artifact: infra

    # Runs inside AzureCLI@2 so `az` is already signed in as the service connection —
    # which is the SQL server's Entra administrator, and the only principal that can
    # create a user in this database. There is no SQL login on the server to fall back on.
    - task: AzureCLI@2
      displayName: 'Run grant-db-access.ps1'
      inputs:
        azureSubscription: '$(serviceConnection)'
        scriptType: pscore
        scriptLocation: scriptPath
        scriptPath: '$(Pipeline.Workspace)/infra/scripts/grant-db-access.ps1'
        arguments: >-
          -SqlServerFqdn "$(sqlServerFqdn)"
          -DatabaseName "$(sqlDatabaseName)"
          -AppName "$(apiIdentityName)"
          -AppClientId "$(apiIdentityClientId)"
          -ScriptPath "$(Pipeline.Workspace)/infra/scripts/grant-db-access.sql"

# =====================================================================================
# 4. Deploy backend
# =====================================================================================
- stage: DeployBackend
  displayName: '4 · Deploy backend'
  # Provision is listed even though GrantDbAccess already depends on it. stageDependencies
  # exposes only stages this one DIRECTLY depends on — a transitive dependency resolves to
  # an empty string, silently, and the failure surfaces in whatever task consumed the
  # variable ("Input required: appName") rather than at the reference.
  dependsOn:
    - Provision
    - GrantDbAccess
  condition: succeeded()
  variables:
    appServiceName: $[ stageDependencies.Provision.Provision.outputs['deploy.appServiceName'] ]
  jobs:
  - job: DeployBackend
    displayName: 'Push the API artifact'
    steps:

    - download: current
      artifact: api

    # An empty stage output reaches the deploy task as a missing input, and the resulting
    # "Input required: appName" says nothing about where the value should have come from.
    # This names the cause instead. Phase E adds stages; this is the failure they will hit.
    - script: |
        set -e
        if [ -z "$(appServiceName)" ]; then
          echo "##vso[task.logissue type=error]appServiceName is empty. The Provision stage output did not resolve — check that this stage lists Provision in dependsOn."
          exit 1
        fi
        echo "Deploying to $(appServiceName)"
      displayName: 'Check the provision outputs resolved'

    - task: AzureWebApp@1
      displayName: 'Deploy to App Service'
      inputs:
        azureSubscription: '$(serviceConnection)'
        appType: webAppLinux
        appName: '$(appServiceName)'
        package: '$(Pipeline.Workspace)/api/api.zip'
        runtimeStack: 'DOTNETCORE|8.0'
        deploymentMethod: zipDeploy

    # No verification step here on purpose. This task reports RuntimeSuccessful while the
    # container is still warming — the spike measured ~33 seconds — so anything checked
    # at this point would be checking the previous state of the app. The smoke stage
    # polls, which is the only reliable way to know the new build is serving.

# =====================================================================================
# 5. Build and deploy frontend
# =====================================================================================
#
# After the backend deploy because the gateway URL is compiled into the JavaScript, and
# before the smoke test because the smoke test should run against the finished system.
- stage: DeployFrontend
  displayName: '5 · Build and deploy frontend'
  # Provision listed directly: stageDependencies only reaches stages this one depends on.
  dependsOn:
    - Provision
    - DeployBackend
  condition: succeeded()
  variables:
    apimGatewayUrl: $[ stageDependencies.Provision.Provision.outputs['deploy.apimGatewayUrl'] ]
    apimServiceName: $[ stageDependencies.Provision.Provision.outputs['deploy.apimServiceName'] ]
    frontendSubscriptionName: $[ stageDependencies.Provision.Provision.outputs['deploy.frontendSubscriptionName'] ]
    storageAccountName: $[ stageDependencies.Provision.Provision.outputs['deploy.storageAccountName'] ]
    frontendOrigin: $[ stageDependencies.Provision.Provision.outputs['deploy.frontendOrigin'] ]
  jobs:
  - job: DeployFrontend
    displayName: 'Build with injected configuration, then upload'
    steps:

    - download: current
      artifact: web

    - task: NodeTool@0
      displayName: 'Install Node 20'
      inputs:
        versionSpec: '20.x'

    # One task, because the APIM subscription key is fetched, used and discarded inside
    # it. It never becomes a pipeline variable and never lands in a file. Rule 7.
    - task: AzureCLI@2
      displayName: 'Build and upload the frontend'
      inputs:
        azureSubscription: '$(serviceConnection)'
        scriptType: bash
        scriptLocation: inlineScript
        workingDirectory: '$(Pipeline.Workspace)/web'
        inlineScript: |
          set -euo pipefail

          # -------------------------------------------------------------------------
          # The redirect URI guard.
          #
          # Entra matches redirect URIs as exact strings with no wildcards. A mismatch
          # fails nowhere on the server: the frontend deploys green, the smoke test
          # passes, and sign-in then fails in the browser with AADSTS50011. This turns
          # that into a stage failure with both strings side by side.
          #
          # It compares the deployed origin against expectedFrontendOrigin, which is a
          # record of what a human registered. It cannot read the registration itself —
          # that is a Microsoft Graph call this principal has no permission to make.
          # -------------------------------------------------------------------------
          echo "==> Redirect URI guard"
          echo "    deployed  : $(frontendOrigin)"
          echo "    registered: $(expectedFrontendOrigin)"
          if [ "$(frontendOrigin)" != "$(expectedFrontendOrigin)" ]; then
            echo "##vso[task.logissue type=error]Deployed frontend origin does not match the origin registered on coupon-spa. Sign-in would fail with AADSTS50011. Either register the deployed origin as a redirect URI and update the expectedFrontendOrigin pipeline variable, or pin storageAccountName to recover the previous URL."
            exit 1
          fi
          echo "    match"

          echo "==> Reading the frontend subscription key"
          SUBSCRIPTION_ID=$(az account show --query id -o tsv)
          FRONTEND_KEY=$(az rest --method post \
            --url "https://management.azure.com/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/$(resourceGroupName)/providers/Microsoft.ApiManagement/service/$(apimServiceName)/subscriptions/$(frontendSubscriptionName)/listSecrets?api-version=2022-08-01" \
            --query primaryKey -o tsv)
          if [ -z "${FRONTEND_KEY}" ]; then
            echo "##vso[task.logissue type=error]Could not read the frontend APIM subscription key."
            exit 1
          fi

          echo "==> npm ci"
          npm ci --no-audit --no-fund

          echo "==> npm run build"
          # Only VITE_-prefixed variables reach the bundle. The build fails on a missing
          # one rather than shipping `undefined`, which would surface as a sign-in that
          # silently does nothing.
          VITE_GATEWAY_URL="$(apimGatewayUrl)" \
          VITE_SPA_CLIENT_ID="$(spaClientId)" \
          VITE_TENANT_ID="$(tenantId)" \
          VITE_API_SCOPE="api://$(apiClientId)/Orders.Write" \
          VITE_SUBSCRIPTION_KEY="${FRONTEND_KEY}" \
            npm run build

          # -------------------------------------------------------------------------
          # The development-only token claims panel must not ship. It is stripped by
          # import.meta.env.DEV, which Vite replaces with `false` in a production build,
          # leaving dead code that Rollup removes along with the module.
          #
          # That is the mechanism. This is the proof. A claims dump on a public site is
          # exactly the thing a reviewer screenshots, so "it should be stripped" is not
          # good enough on its own.
          # -------------------------------------------------------------------------
          echo "==> Checking the dev-only claims panel was stripped"
          if grep -rq "PIZZASHOP_DEV_ONLY_TOKEN_CLAIMS_PANEL" dist/; then
            echo "##vso[task.logissue type=error]The development-only token claims panel is present in the production bundle. It renders decoded access token claims and must never be deployed."
            exit 1
          fi
          echo "    absent"

          # -------------------------------------------------------------------------
          # Static website is a data-plane setting with no ARM property, so it cannot
          # live in Bicep. Verified before this was written: this call works over OAuth
          # with the pipeline's existing Contributor, because it maps to the
          # management-plane action Microsoft.Storage/storageAccounts/blobServices/write.
          #
          # The 404 document is index.html so a refresh on a client-side route does not
          # 404. approach.md section 6.
          # -------------------------------------------------------------------------
          echo "==> Enabling the static website"
          az storage blob service-properties update \
            --account-name "$(storageAccountName)" \
            --auth-mode login \
            --static-website true \
            --index-document index.html \
            --404-document index.html \
            --output none

          # -------------------------------------------------------------------------
          # Uploading blob CONTENT is a data action, which Contributor does not include:
          # over OAuth it returns "You do not have the required permissions".
          #
          # The obvious fix — have Bicep assign Storage Blob Data Contributor — does not
          # work either. Contributor's notActions include Microsoft.Authorization/*/Write,
          # so the pipeline cannot create a role assignment at all. Attempting it fails the
          # whole deployment before a single resource is touched.
          #
          # Closing that gap would mean granting the service connection User Access
          # Administrator: the power to grant itself any role, on anything, permanently.
          # The account key is the smaller grant by a wide margin — Contributor already
          # includes listKeys, so this principal can obtain the key regardless. Fetching it
          # here adds no privilege it does not already have.
          #
          # The key is read, used and discarded inside this one task. It is never a
          # pipeline variable, never echoed, and never written to a file. Rule 7.
          # -------------------------------------------------------------------------
          echo "==> Uploading the bundle"
          ACCOUNT_KEY=$(az storage account keys list \
            --account-name "$(storageAccountName)" \
            --resource-group "$(resourceGroupName)" \
            --query "[0].value" -o tsv)
          if [ -z "${ACCOUNT_KEY}" ]; then
            echo "##vso[task.logissue type=error]Could not read the storage account key."
            exit 1
          fi

          az storage blob upload-batch \
            --account-name "$(storageAccountName)" \
            --account-key "${ACCOUNT_KEY}" \
            --destination '$web' \
            --source dist \
            --overwrite \
            --output none
          unset ACCOUNT_KEY

          echo ""
          echo "Frontend: $(frontendOrigin)"

# =====================================================================================
# 6. Smoke test
# =====================================================================================
- stage: SmokeTest
  displayName: '6 · Smoke test'
  # Provision listed for the same reason as the deploy stage above: this stage reads its
  # outputs, so it must depend on it directly.
  dependsOn:
    - Provision
    - DeployFrontend
  condition: succeeded()
  variables:
    apimServiceName: $[ stageDependencies.Provision.Provision.outputs['deploy.apimServiceName'] ]
    frontendOrigin: $[ stageDependencies.Provision.Provision.outputs['deploy.frontendOrigin'] ]
    apimGatewayUrl: $[ stageDependencies.Provision.Provision.outputs['deploy.apimGatewayUrl'] ]
    apimSubscriptionName: $[ stageDependencies.Provision.Provision.outputs['deploy.apimSubscriptionName'] ]
  jobs:
  - job: SmokeTest
    displayName: 'Call the gateway and check the response body'
    steps:

    - download: current
      artifact: infra

    # The subscription key is fetched and used inside a single task, so it is never a
    # pipeline variable, never an artifact, and never in a file. Rule 7.
    - task: AzureCLI@2
      displayName: 'Run smoke-test.ps1'
      inputs:
        azureSubscription: '$(serviceConnection)'
        scriptType: pscore
        scriptLocation: inlineScript
        inlineScript: |
          $ErrorActionPreference = 'Stop'

          $subscriptionId = az account show --query id -o tsv
          $url = "https://management.azure.com/subscriptions/$subscriptionId" +
                 "/resourceGroups/$(resourceGroupName)" +
                 "/providers/Microsoft.ApiManagement/service/$(apimServiceName)" +
                 "/subscriptions/$(apimSubscriptionName)/listSecrets?api-version=2022-08-01"

          $key = az rest --method post --url $url --query primaryKey -o tsv
          if ([string]::IsNullOrWhiteSpace($key)) {
            throw 'Could not read the APIM subscription key.'
          }

          & "$(Pipeline.Workspace)/infra/scripts/smoke-test.ps1" `
              -GatewayUrl "$(apimGatewayUrl)" `
              -SubscriptionKey $key `
              -FrontendOrigin "$(frontendOrigin)"
