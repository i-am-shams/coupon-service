# Coupon service — build, provision, deploy, verify.
#
# The stage order is approach.md §7. Two orderings in it are load-bearing rather than
# tidy:
#
#   Build and test run first, so no Azure resource is ever created for code that does not
#   compile.
#
#   Grant DB access runs before the backend is deployed. The application runs its EF Core
#   migrations at startup, so an app deployed before its database user exists starts,
#   fails, and reports a deployment problem for what is actually a permissions problem.
#
# Deleting the resource group and running this pipeline produces a working system. The
# one thing that would otherwise break that promise is APIM soft-delete, handled in the
# provision stage below.
#
# No secret appears in this file. The App Service reaches SQL with its managed identity,
# APIM reaches the App Service with its own, and the subscription key the smoke test uses
# is read from APIM at the moment it is needed.

trigger:
  branches:
    include:
      - master
      - main

pool:
  vmImage: ubuntu-latest

variables:
  # --- Deployment target -------------------------------------------------------------
  serviceConnection: 'azure-lab'
  resourceGroupName: 'rg-coupon-service'
  location: 'centralindia'

  # --- Bicep parameters --------------------------------------------------------------
  namePrefix: 'couponsvc'
  environmentName: 'lab'

  # The coupon-api app registration, created on Day 0 (approach.md §7). A client ID is a
  # public identifier, not a credential — it appears in every token this API issues.
  # docs/decisions.md, "Spike 3 — app registrations and the PKCE flow".
  apiClientId: '90a27142-cffb-4879-873a-bc0a99112ce7'

  # Used by API Management for service notifications only.
  apimPublisherEmail: 'publisher@example.com'
  apimPublisherName: 'Coupon Service'

  # --- Build -------------------------------------------------------------------------
  buildConfiguration: 'Release'
  apiProject: 'src/PizzaShop.Api/PizzaShop.Api.csproj'

stages:

# =====================================================================================
# 1. Build and test
# =====================================================================================
- stage: BuildAndTest
  displayName: '1 · Build and test'
  jobs:
  - job: BuildAndTest
    displayName: 'Build, test, publish artifact'
    steps:

    - task: UseDotNet@2
      displayName: 'Install .NET 8 SDK'
      inputs:
        packageType: sdk
        version: '8.0.x'

    - script: dotnet restore PizzaShop.sln
      displayName: 'Restore'

    - script: dotnet build PizzaShop.sln --configuration $(buildConfiguration) --no-restore
      displayName: 'Build'

    # The BDD scenarios run against SQLite in-memory through WebApplicationFactory, so
    # they need no Azure resource and no database — which is why this stage comes before
    # anything is provisioned.
    - script: >-
        dotnet test PizzaShop.sln
        --configuration $(buildConfiguration)
        --no-build
        --logger trx
        --results-directory $(Agent.TempDirectory)/testresults
      displayName: 'Test'

    - task: PublishTestResults@2
      displayName: 'Publish test results'
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: VSTest
        testResultsFiles: '**/*.trx'
        searchFolder: '$(Agent.TempDirectory)/testresults'
        failTaskOnFailedTests: true

    - script: >-
        dotnet publish $(apiProject)
        --configuration $(buildConfiguration)
        --no-build
        --output $(Build.ArtifactStagingDirectory)/api
      displayName: 'Publish API'

    - task: ArchiveFiles@2
      displayName: 'Archive API'
      inputs:
        rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/api'
        includeRootFolder: false
        archiveType: zip
        archiveFile: '$(Build.ArtifactStagingDirectory)/api.zip'
        replaceExistingArchive: true

    - publish: '$(Build.ArtifactStagingDirectory)/api.zip'
      artifact: api
      displayName: 'Publish artifact'

    # infra/ is needed by later stages — the Bicep templates, the grant script and the
    # smoke test. Publishing it as an artifact means every stage deploys the same
    # revision, rather than each re-checking out and possibly picking up a newer commit.
    - publish: 'infra'
      artifact: infra
      displayName: 'Publish infrastructure sources'

# =====================================================================================
# 2. Provision
# =====================================================================================
- stage: Provision
  displayName: '2 · Provision'
  dependsOn: BuildAndTest
  condition: succeeded()
  jobs:
  - job: Provision
    displayName: 'Resource group and Bicep deployment'
    steps:

    - download: current
      artifact: infra

    - task: AzureCLI@2
      name: deploy
      displayName: 'Deploy infra/main.bicep'
      inputs:
        azureSubscription: '$(serviceConnection)'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -euo pipefail

          SUBSCRIPTION_ID=$(az account show --query id -o tsv)

          echo "==> Resource group"
          az group create \
            --name "$(resourceGroupName)" \
            --location "$(location)" \
            --output none

          # ---------------------------------------------------------------------------
          # APIM soft-delete purge.
          #
          # Deleting the resource group does not free an API Management name. The service
          # is soft-deleted for 48 hours and keeps its name reserved, so recreating it
          # fails with "service name is not available" — which reads as a naming
          # collision rather than as the residue of the previous teardown.
          #
          # Without this step, "delete the resource group and run the pipeline" does not
          # produce a working system, which is the acceptance test for this project.
          # ---------------------------------------------------------------------------
          echo "==> Purging any soft-deleted API Management service for this project"
          DELETED=$(az rest --method get \
            --url "https://management.azure.com/subscriptions/${SUBSCRIPTION_ID}/providers/Microsoft.ApiManagement/deletedservices?api-version=2022-08-01" \
            --query "value[?starts_with(name, 'apim-$(namePrefix)-$(environmentName)-')].id" -o tsv || true)

          if [ -n "${DELETED}" ]; then
            for id in ${DELETED}; do
              echo "    purging ${id}"
              az rest --method delete --url "https://management.azure.com${id}?api-version=2022-08-01" --output none
            done
          else
            echo "    none found"
          fi

          # ---------------------------------------------------------------------------
          # The SQL Entra administrator has to be this pipeline's own principal, and ARM
          # wants its OBJECT ID. Recovering an object ID normally means `az ad sp show`,
          # a Microsoft Graph call this service principal has no permission to make.
          #
          # The ARM access token already carries it: `oid` is the principal's object ID
          # in this tenant. Reading it out of the token needs no directory permission at
          # all, which is what keeps Day 0 to the three items in approach.md §7.
          #
          # The token is never echoed and never leaves this step.
          # ---------------------------------------------------------------------------
          echo "==> Deriving the pipeline principal's object ID from the ARM token"
          ARM_TOKEN=$(az account get-access-token --resource https://management.azure.com/ --query accessToken -o tsv)
          SQL_ADMIN_OBJECT_ID=$(printf '%s' "${ARM_TOKEN}" | cut -d. -f2 | python3 -c \
            'import sys,base64,json; p=sys.stdin.read().strip(); p+="="*(-len(p)%4); print(json.loads(base64.urlsafe_b64decode(p))["oid"])')
          unset ARM_TOKEN
          echo "    object ID: ${SQL_ADMIN_OBJECT_ID}"

          echo "==> Bicep deployment"
          az deployment group create \
            --resource-group "$(resourceGroupName)" \
            --name "coupon-service-$(Build.BuildId)" \
            --template-file "$(Pipeline.Workspace)/infra/main.bicep" \
            --parameters \
                location="$(location)" \
                namePrefix="$(namePrefix)" \
                environmentName="$(environmentName)" \
                apiClientId="$(apiClientId)" \
                sqlAdminObjectId="${SQL_ADMIN_OBJECT_ID}" \
                sqlAdminLogin="$(serviceConnection)-pipeline" \
                apimPublisherEmail="$(apimPublisherEmail)" \
                apimPublisherName="$(apimPublisherName)" \
            --output none

          echo "==> Reading outputs"
          OUTPUTS=$(az deployment group show \
            --resource-group "$(resourceGroupName)" \
            --name "coupon-service-$(Build.BuildId)" \
            --query properties.outputs -o json)

          get() { printf '%s' "${OUTPUTS}" | python3 -c "import sys,json;print(json.load(sys.stdin)['$1']['value'])"; }

          APP_SERVICE_NAME=$(get appServiceName)
          API_IDENTITY_CLIENT_ID=$(get apiIdentityClientId)
          API_IDENTITY_NAME=$(get apiIdentityName)
          SQL_SERVER_FQDN=$(get sqlServerFqdn)
          SQL_DATABASE_NAME=$(get sqlDatabaseName)
          APIM_SERVICE_NAME=$(get apimServiceName)
          APIM_GATEWAY_URL=$(get apimGatewayUrl)
          APIM_SUBSCRIPTION_NAME=$(get apimSubscriptionName)
          STORAGE_ACCOUNT_NAME=$(get storageAccountName)
          FRONTEND_ORIGIN=$(get frontendOrigin)

          # Republished as stage outputs so the later stages can read them.
          echo "##vso[task.setvariable variable=appServiceName;isOutput=true]${APP_SERVICE_NAME}"
          echo "##vso[task.setvariable variable=apiIdentityClientId;isOutput=true]${API_IDENTITY_CLIENT_ID}"
          echo "##vso[task.setvariable variable=apiIdentityName;isOutput=true]${API_IDENTITY_NAME}"
          echo "##vso[task.setvariable variable=sqlServerFqdn;isOutput=true]${SQL_SERVER_FQDN}"
          echo "##vso[task.setvariable variable=sqlDatabaseName;isOutput=true]${SQL_DATABASE_NAME}"
          echo "##vso[task.setvariable variable=apimServiceName;isOutput=true]${APIM_SERVICE_NAME}"
          echo "##vso[task.setvariable variable=apimGatewayUrl;isOutput=true]${APIM_GATEWAY_URL}"
          echo "##vso[task.setvariable variable=apimSubscriptionName;isOutput=true]${APIM_SUBSCRIPTION_NAME}"
          echo "##vso[task.setvariable variable=storageAccountName;isOutput=true]${STORAGE_ACCOUNT_NAME}"
          echo "##vso[task.setvariable variable=frontendOrigin;isOutput=true]${FRONTEND_ORIGIN}"

          echo ""
          echo "Gateway  : ${APIM_GATEWAY_URL}"
          echo "Backend  : ${APP_SERVICE_NAME}"
          echo "Database : ${SQL_SERVER_FQDN}/${SQL_DATABASE_NAME}"
          echo "Frontend : ${FRONTEND_ORIGIN}"
          echo ""
          echo "Phase E note: the frontend origin above must be registered as a redirect URI on"
          echo "the coupon-spa app registration, character for character. Entra does exact string"
          echo "matching. The storage account name is pinned so this URL is stable, but the DNS"
          echo "zone segment is assigned at account creation — if the account was ever recreated,"
          echo "compare this value against the registration before trusting it."

# =====================================================================================
# 3. Grant database access
# =====================================================================================
- stage: GrantDbAccess
  displayName: '3 · Grant database access'
  dependsOn: Provision
  condition: succeeded()
  variables:
    sqlServerFqdn: $[ stageDependencies.Provision.Provision.outputs['deploy.sqlServerFqdn'] ]
    sqlDatabaseName: $[ stageDependencies.Provision.Provision.outputs['deploy.sqlDatabaseName'] ]
    apiIdentityName: $[ stageDependencies.Provision.Provision.outputs['deploy.apiIdentityName'] ]
    apiIdentityClientId: $[ stageDependencies.Provision.Provision.outputs['deploy.apiIdentityClientId'] ]
  jobs:
  - job: GrantDbAccess
    displayName: 'Create the contained user for the App Service identity'
    steps:

    - download: current
      artifact: infra

    # Runs inside AzureCLI@2 so `az` is already signed in as the service connection —
    # which is the SQL server's Entra administrator, and the only principal that can
    # create a user in this database. There is no SQL login on the server to fall back on.
    - task: AzureCLI@2
      displayName: 'Run grant-db-access.ps1'
      inputs:
        azureSubscription: '$(serviceConnection)'
        scriptType: pscore
        scriptLocation: scriptPath
        scriptPath: '$(Pipeline.Workspace)/infra/scripts/grant-db-access.ps1'
        arguments: >-
          -SqlServerFqdn "$(sqlServerFqdn)"
          -DatabaseName "$(sqlDatabaseName)"
          -AppName "$(apiIdentityName)"
          -AppClientId "$(apiIdentityClientId)"
          -ScriptPath "$(Pipeline.Workspace)/infra/scripts/grant-db-access.sql"

# =====================================================================================
# 4. Deploy backend
# =====================================================================================
- stage: DeployBackend
  displayName: '4 · Deploy backend'
  dependsOn: GrantDbAccess
  condition: succeeded()
  variables:
    appServiceName: $[ stageDependencies.Provision.Provision.outputs['deploy.appServiceName'] ]
  jobs:
  - job: DeployBackend
    displayName: 'Push the API artifact'
    steps:

    - download: current
      artifact: api

    - task: AzureWebApp@1
      displayName: 'Deploy to App Service'
      inputs:
        azureSubscription: '$(serviceConnection)'
        appType: webAppLinux
        appName: '$(appServiceName)'
        package: '$(Pipeline.Workspace)/api/api.zip'
        runtimeStack: 'DOTNETCORE|8.0'
        deploymentMethod: zipDeploy

    # No verification step here on purpose. This task reports RuntimeSuccessful while the
    # container is still warming — the spike measured ~33 seconds — so anything checked
    # at this point would be checking the previous state of the app. The smoke stage
    # polls, which is the only reliable way to know the new build is serving.

# =====================================================================================
# 5. Build and deploy frontend — phase E
# =====================================================================================
#
# Not present yet. When it lands it goes here, between the backend deploy and the smoke
# test, because the gateway URL is compiled into the JavaScript and the smoke test should
# run against the finished system. It also owns turning the static website on:
#   az storage blob service-properties update --account-name <name> --static-website \
#     --index-document index.html --404-document index.html
# which is a data-plane call and therefore cannot live in Bicep.

# =====================================================================================
# 6. Smoke test
# =====================================================================================
- stage: SmokeTest
  displayName: '6 · Smoke test'
  dependsOn: DeployBackend
  condition: succeeded()
  variables:
    apimServiceName: $[ stageDependencies.Provision.Provision.outputs['deploy.apimServiceName'] ]
    apimGatewayUrl: $[ stageDependencies.Provision.Provision.outputs['deploy.apimGatewayUrl'] ]
    apimSubscriptionName: $[ stageDependencies.Provision.Provision.outputs['deploy.apimSubscriptionName'] ]
  jobs:
  - job: SmokeTest
    displayName: 'Call the gateway and check the response body'
    steps:

    - download: current
      artifact: infra

    # The subscription key is fetched and used inside a single task, so it is never a
    # pipeline variable, never an artifact, and never in a file. Rule 7.
    - task: AzureCLI@2
      displayName: 'Run smoke-test.ps1'
      inputs:
        azureSubscription: '$(serviceConnection)'
        scriptType: pscore
        scriptLocation: inlineScript
        inlineScript: |
          $ErrorActionPreference = 'Stop'

          $subscriptionId = az account show --query id -o tsv
          $url = "https://management.azure.com/subscriptions/$subscriptionId" +
                 "/resourceGroups/$(resourceGroupName)" +
                 "/providers/Microsoft.ApiManagement/service/$(apimServiceName)" +
                 "/subscriptions/$(apimSubscriptionName)/listSecrets?api-version=2022-08-01"

          $key = az rest --method post --url $url --query primaryKey -o tsv
          if ([string]::IsNullOrWhiteSpace($key)) {
            throw 'Could not read the APIM subscription key.'
          }

          & "$(Pipeline.Workspace)/infra/scripts/smoke-test.ps1" `
              -GatewayUrl "$(apimGatewayUrl)" `
              -SubscriptionKey $key
